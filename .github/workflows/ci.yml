name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install formatting tools
        run: python -m pip install pre-commit clang-format
      - name: Check formatting
        run: pre-commit run --config .githooks/.pre-commit-config.yaml --all-files --show-diff-on-failure

  tests:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and test dependencies
        run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build
      - name: Configure
        run: >-
          cmake -S common -B build -G Ninja
          -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --parallel 2
      - name: Test

        run: ctest --test-dir build --output-on-failure
